# Settings for headless / shared hosting (Streamlit Community Cloud and friends).
# Locally these are harmless: `streamlit run app.py` still serves on :8501.

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = true
enableXsrfProtection = true

[browser]
# No telemetry from a public deployment.
gatherUsageStats = false

[client]
# Hide Streamlit's Deploy / hamburger toolbar: the dashboard is the product.
toolbarMode = "minimal"

[theme]
# Same palette as the LIVE / STALE / OFFLINE pill in app.py.
primaryColor = "#1b7f3b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7f6"
textColor = "#1f2328"
font = "sans serif"
